<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자모음 · 받침 연습 (모음 전체 완성판)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE9DC;
    --paper-deep:#E2D9C4;
    --ink:#262220;
    --ink-soft:#5B5349;
    --indigo:#29496B;
    --indigo-soft:#3E6188;
    --vermilion:#B23A2E;
    --vermilion-soft:#D96256;
    --gold:#B4842A;
    --card:#FBF8F1;
    --line: rgba(38,34,32,0.14);
    --radius: 10px;
    --sans:'Gowun Dodum', sans-serif;
    --display:'Black Han Sans', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#20211d;
      --paper-deep:#2a2b24;
      --ink:#ECE6D8;
      --ink-soft:#B9B2A2;
      --card:#2b2c26;
      --line: rgba(236,230,216,0.14);
    }
  }
  *{box-sizing:border-box;}
  html{ scroll-padding-top: env(safe-area-inset-top,0px); }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 20px 60px;}

  /* ---------- Hero ---------- */
  header.hero{
    position:relative;
    padding:30px 20px 20px;
    background:
      radial-gradient(120px 120px at 88% 18%, rgba(178,58,46,0.16), transparent 70%),
      var(--paper);
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .hero-inner{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .seal{
    flex:0 0 auto;
    width:64px;height:64px;border-radius:50%;
    background:var(--vermilion);
    color:#F6E9C9;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);
    font-size:26px;
    box-shadow:0 0 0 3px var(--paper), 0 0 0 4px var(--vermilion-soft);
    transform:rotate(-6deg);
  }
  .hero-text h1{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(24px,4vw,32px);
    margin:0 0 4px;
    color:var(--indigo);
  }
  .hero-text p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.5;
  }

  /* ---------- Tabs ---------- */
  nav.tabs{
    position:sticky; top:0; z-index:20;
    padding-top:env(safe-area-inset-top,0px);
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .tabs-scroll{
    max-width:920px;margin:0 auto;
    display:flex; gap:4px; overflow-x:auto; padding:10px 16px;
    scrollbar-width:none;
  }
  .tabs-scroll::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto;
    font-family:var(--sans);
    font-size:14.5px;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid transparent;
    padding:9px 15px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn[aria-selected="true"]{
    background:var(--indigo);
    color:#F3EFE2;
    border-color:var(--indigo);
  }

  section.panel{display:none; padding-top:24px;}
  section.panel.active{display:block;}

  h2.section-title{
    font-family:var(--display);
    font-weight:400;
    color:var(--indigo);
    font-size:20px;
    margin:0 0 6px;
  }
  p.section-lede{color:var(--ink-soft); margin:0 0 16px; font-size:14px; line-height:1.5;}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .chip{
    font-family:var(--sans);
    font-size:13px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  .chip[aria-pressed="true"]{
    background:var(--indigo); color:#F3EFE2; border-color:var(--indigo);
  }

  /* ---------- Grid ---------- */
  .grid-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--card);}
  table.combo{border-collapse:collapse; width:100%; min-width:500px;}
  table.combo th, table.combo td{border:1px solid var(--line); text-align:center; padding:0;}
  table.combo thead th, table.combo tbody th{
    font-family:var(--sans); font-weight:400; color:var(--ink-soft);
    font-size:12px; padding:8px 4px; background:var(--paper-deep);
  }
  .cell-btn{
    width:100%; height:58px;
    border:none; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:var(--display); font-size:20px; color:var(--ink);
  }
  .cell-btn.revealed .hangul{ color:var(--indigo); }

  /* ---------- Cards ---------- */
  .word-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px;}
  .word-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; display:flex; flex-direction:column; gap:6px;
  }
  .word-card .top-row{display:flex; align-items:center; justify-content:space-between;}
  .word-card .emoji{font-size:22px;}
  .word-card .hangul-big{font-family:var(--display); font-size:22px;}
  .speak-btn{
    border:1px solid var(--line); background:var(--paper-deep); color:var(--indigo);
    border-radius:6px; width:30px; height:30px; cursor:pointer; font-size:14px;
  }
  .word-card input.meaning{
    font-family:var(--sans); font-size:12px; padding:6px 8px; border:1px solid var(--line);
    border-radius:6px; background:var(--paper); color:var(--ink); width:100%;
  }

  .check-btn{
    font-size:11px; padding:4px 8px; background:var(--indigo); color:#fff;
    border:none; border-radius:4px; cursor:pointer; margin-top:2px;
  }
  .check-result{font-size:11px; margin-top:2px; font-weight:bold;}
  .check-result.correct{color:green;}
  .check-result.incorrect{color:var(--vermilion);}

  /* ---------- Flashcards ---------- */
  .flashcard-stage{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .flashcard{
    width:100%; max-width:340px; min-height:200px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; cursor:pointer; text-align:center; gap:8px;
  }
  .flashcard .emoji-lg{font-size:36px;}
  .flashcard .hangul-xl{font-family:var(--display); font-size:40px; color:var(--indigo);}
  .flashcard .rom-reveal{font-size:16px; color:var(--vermilion); font-weight:600;}
  .card-controls{display:flex; align-items:center; gap:12px;}
  .round-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--indigo); font-size:16px; cursor:pointer;
  }
  .meaning-row{width:100%; max-width:340px; display:flex; flex-direction:column; gap:6px;}
  .meaning-row input{
    font-family:var(--sans); font-size:13px; padding:8px 10px; border:1px solid var(--line);
    border-radius:8px; background:var(--card); color:var(--ink);
  }

  /* ---------- Pad ---------- */
  .write-controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;}
  select#writeSelect{
    font-family:var(--sans); font-size:13px; padding:6px 8px; border:1px solid var(--line);
    border-radius:6px; background:var(--card); color:var(--ink);
  }
  .pad-wrap{
    border:1px solid var(--line); border-radius:var(--radius); background:var(--card);
    padding:12px; display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  canvas#pad{
    touch-action:none; width:100%; max-width:400px; aspect-ratio:1/1;
    background:var(--paper); border-radius:8px; border:1px dashed var(--line);
  }
  .btn{
    font-family:var(--sans); font-size:13px; padding:6px 12px; border-radius:6px;
    border:1px solid var(--line); background:var(--paper-deep); color:var(--ink); cursor:pointer;
  }
  .btn.primary{background:var(--indigo); border-color:var(--indigo); color:#F3EFE2;}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="seal" aria-hidden="true">한</div>
    <div class="hero-text">
      <h1>자모음 · 받침 연습 (모음 전체 완성판)</h1>
      <p>단모음부터 이중·결합 모음 21개 전체를 '그, 느, 드' 정확한 음성으로 배우고 다국어로 뜻을 확인해 보세요!</p>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-scroll" role="tablist">
    <button class="tab-btn" role="tab" aria-selected="true" data-tab="combo">자음+모음</button>
    <button class="tab-btn" role="tab" aria-selected="false" data-tab="batchim">받침 단어</button>
    <button class="tab-btn" role="tab" aria-selected="false" data-tab="cards">기초 단어 카드</button>
    <button class="tab-btn" role="tab" aria-selected="false" data-tab="write">쓰기 연습장</button>
  </div>
</nav>

<main class="wrap">

  <!-- TAB 1: Combo -->
  <section class="panel active" id="panel-combo">
    <h2 class="section-title">자음 + 모음 결합표</h2>
    <p class="section-lede">버튼을 눌러 확장 모음 및 복합 이중 모음(총 21개)까지 모두 확인해 보세요.</p>
    <div class="toolbar">
      <button class="chip" id="toggleDouble" aria-pressed="false">쌍자음 (ㄲㄸㅃㅆㅉ)</button>
      <button class="chip" id="toggleExtra" aria-pressed="false">확장 모음 (ㅐㅔㅑㅕㅛㅠㅒㅖ)</button>
      <button class="chip" id="toggleComplex" aria-pressed="false">복합 모음 (ㅘㅙㅚㅝㅞㅟㅢ)</button>
    </div>
    <div class="grid-scroll">
      <table class="combo" id="comboTable"></table>
    </div>
  </section>

  <!-- TAB 2: Batchim -->
  <section class="panel" id="panel-batchim">
    <h2 class="section-title">대표 받침 단어 학습</h2>
    <p class="section-lede">받침이 들어간 단어를 듣고 자기 나라 언어로 뜻을 적은 후 [정답 확인]을 눌러보세요.</p>
    <div class="word-grid" id="batchimWords"></div>
  </section>

  <!-- TAB 3: Flashcards -->
  <section class="panel" id="panel-cards">
    <h2 class="section-title">기초 단어 카드</h2>
    <div class="flashcard-stage">
      <div class="flashcard" id="flashcard">
        <div class="emoji-lg" id="cardEmoji"></div>
        <div class="hangul-xl" id="cardHangul"></div>
        <div class="rom-reveal" id="cardRom" style="display:none;"></div>
      </div>
      <div class="card-controls">
        <button class="round-btn" id="prevCard">‹</button>
        <button class="round-btn" id="speakCard">🔊</button>
        <button class="round-btn" id="nextCard">›</button>
      </div>
      <div class="meaning-row">
        <input id="cardMeaning" type="text" placeholder="내 나라 말로 뜻 작성 (예: apple, 苹果, स्याउ, 🍎)">
        <button class="btn primary" id="checkCardMeaningBtn">정답 확인</button>
        <div class="check-result" id="cardCheckResult"></div>
      </div>
    </div>
  </section>

  <!-- TAB 4: Writing -->
  <section class="panel" id="panel-write">
    <h2 class="section-title">쓰기 연습장</h2>
    <div class="write-controls">
      <select id="writeSelect"></select>
      <button class="btn" id="speakWrite">🔊 정확한 소리 듣기</button>
    </div>
    <div class="pad-wrap">
      <canvas id="pad"></canvas>
      <button class="btn primary" id="clearPad">지우기</button>
    </div>
  </section>

</main>

<script>
(function(){
  "use strict";

  /* --- 한글 전체 자음 및 21개 모음 정의 --- */
  var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  var JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];

  // 자음/모음 발음 고정 매핑
  var PHONETIC_MAP = {
    'ㄱ':'그', 'ㄴ':'느', 'ㄷ':'드', 'ㄹ':'르', 'ㅁ':'므', 'ㅂ':'브', 'ㅅ':'스',
    'ㅇ':'으', 'ㅈ':'즈', 'ㅊ':'츠', 'ㅋ':'크', 'ㅌ':'트', 'ㅍ':'프', 'ㅎ':'흐',
    'ㄲ':'끄', 'ㄸ':'뜨', 'ㅃ':'쁘', 'ㅆ':'쓰', 'ㅉ':'쯔',
    'ㅏ':'아', 'ㅓ':'어', 'ㅗ':'오', 'ㅜ':'우', 'ㅡ':'으', 'ㅣ':'이',
    'ㅐ':'애', 'ㅔ':'에', 'ㅑ':'야', 'ㅕ':'여', 'ㅛ':'요', 'ㅠ':'유',
    'ㅒ':'얘', 'ㅖ':'예', 'ㅘ':'와', 'ㅙ':'왜', 'ㅚ':'외',
    'ㅝ':'워', 'ㅞ':'웨', 'ㅟ':'위', 'ㅢ':'의'
  };

  /* --- 받침 단어 데이터 --- */
  var BATCHIM_WORDS = [
    {kr:'책', rom:'chaek', emoji:'📖', meanings:['book', '书', 'किताब', 'ном', 'පොත']},
    {kr:'눈', rom:'nun', emoji:'❄️', meanings:['snow', 'eye', '雪', '眼睛', 'हिउँ', '눈']},
    {kr:'옷', rom:'ot', emoji:'👕', meanings:['clothes', 'clothing', '衣服', 'लुगा', 'хувцас']},
    {kr:'딸기', rom:'ttalgi', emoji:'🍓', meanings:['strawberry', '草莓', 'स्ट्रาबेरी', 'жимсгэнэ']},
    {kr:'밤', rom:'bam', emoji:'🌙', meanings:['night', 'chestnut', '夜晚', 'राति', 'шөнө']},
    {kr:'집', rom:'jip', emoji:'🏠', meanings:['house', 'home', '房子', 'घर', 'байшин']},
    {kr:'공', rom:'gong', emoji:'⚽', meanings:['ball', '球', 'बल', 'бөмбөг']},
    {kr:'닭', rom:'dak', emoji:'🐔', meanings:['chicken', 'rooster', '鸡', 'कुखुरा', 'тахи아']},
    {kr:'꽃', rom:'kkot', emoji:'🌸', meanings:['flower', '花', 'फूल', 'цэцэг']},
    {kr:'밭', rom:'bat', emoji:'🌱', meanings:['field', 'farm', '田地', 'ਖੇਤ', 'खेती']}
  ];

  /* --- 기초 단어 카드 데이터 --- */
  var BASIC_WORDS = [
    {kr:'가방', rom:'gabang', emoji:'🎒', meanings:['bag', '包', 'झोला', 'цүнх']},
    {kr:'사과', rom:'sagwa', emoji:'🍎', meanings:['apple', '苹果', 'स्याउ', 'алим']},
    {kr:'나비', rom:'nabi', emoji:'🦋', meanings:['butterfly', '蝴蝶', 'पुतली', 'эрвээхэй']},
    {kr:'다리', rom:'dari', emoji:'🌉', meanings:['bridge', 'leg', '桥', '腿', 'पुल']},
    {kr:'모자', rom:'moja', emoji:'🧢', meanings:['hat', 'cap', '帽子', 'टोपी']},
    {kr:'바나나', rom:'banana', emoji:'🍌', meanings:['banana', '香蕉', 'केरा']},
    {kr:'시계', rom:'sigye', emoji:'🕐', meanings:['clock', 'watch', '钟表', 'घडी']},
    {kr:'의자', rom:'uija', emoji:'🪑', meanings:['chair', '椅子', 'कुर्सी']},
    {kr:'우산', rom:'usan', emoji:'☂️', meanings:['umbrella', '雨伞', 'छाता']},
    {kr:'책', rom:'chaek', emoji:'📖', meanings:['book', '书', 'किताब']}
  ];

  function compose(cho, jung){
    var ci = CHO.indexOf(cho), ji = JUNG.indexOf(jung);
    if(ci < 0 || ji < 0) return '';
    return String.fromCharCode(0xAC00 + (ci*21 + ji)*28);
  }

  /* --- TTS 함수 --- */
  function speak(text){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    
    var soundText = PHONETIC_MAP[text] || text;
    var u = new SpeechSynthesisUtterance(soundText);
    u.lang = 'ko-KR';
    u.rate = 0.75;
    u.pitch = 1.0;
    
    var voices = window.speechSynthesis.getVoices();
    var koVoice = voices.find(function(v){ return v.lang.includes('ko') || v.lang.includes('KO'); });
    if(koVoice) u.voice = koVoice;

    window.speechSynthesis.speak(u);
  }

  /* --- 탭 전환 --- */
  var tabButtons = document.querySelectorAll('.tab-btn');
  var panels = { combo:document.getElementById('panel-combo'), batchim:document.getElementById('panel-batchim'), cards:document.getElementById('panel-cards'), write:document.getElementById('panel-write') };
  tabButtons.forEach(function(b){
    b.addEventListener('click', function(){
      tabButtons.forEach(function(btn){ btn.setAttribute('aria-selected', 'false'); });
      b.setAttribute('aria-selected', 'true');
      Object.keys(panels).forEach(function(k){ panels[k].classList.toggle('active', k === b.dataset.tab); });
    });
  });

  /* --- TAB 1: 결합표 (모음 확장 지원) --- */
  var BASIC_CONS = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  var DOUBLE_CONS = ['ㄲ','ㄸ','ㅃ','ㅆ','ㅉ'];
  var BASIC_VOWELS = ['ㅏ','ㅓ','ㅗ','ㅜ','ㅡ','ㅣ'];
  var EXTRA_VOWELS = ['ㅐ','ㅔ','ㅑ','ㅕ','ㅛ','ㅠ','ㅒ','ㅖ'];
  var COMPLEX_VOWELS = ['ㅘ','ㅙ','ㅚ','ㅝ','ㅞ','ㅟ','ㅢ'];
  
  var showDouble = false, showExtra = false, showComplex = false;

  function renderCombo(){
    var cons = BASIC_CONS.concat(showDouble ? DOUBLE_CONS : []);
    var vowels = BASIC_VOWELS.concat(showExtra ? EXTRA_VOWELS : []).concat(showComplex ? COMPLEX_VOWELS : []);
    var html = '<thead><tr><th></th>';
    vowels.forEach(function(v){ html += '<th>'+v+'</th>'; });
    html += '</tr></thead><tbody>';
    cons.forEach(function(c){
      html += '<tr><th>'+c+'</th>';
      vowels.forEach(function(v){
        var syll = compose(c, v);
        html += '<td><button class="cell-btn" data-syll="'+syll+'"><span class="hangul">'+syll+'</span></button></td>';
      });
      html += '</tr>';
    });
    html += '</tbody>';
    var table = document.getElementById('comboTable');
    table.innerHTML = html;
    table.querySelectorAll('.cell-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        btn.classList.add('revealed');
        speak(btn.dataset.syll);
      });
    });
  }
  document.getElementById('toggleDouble').addEventListener('click', function(){
    showDouble = !showDouble; this.setAttribute('aria-pressed', showDouble); renderCombo();
  });
  document.getElementById('toggleExtra').addEventListener('click', function(){
    showExtra = !showExtra; this.setAttribute('aria-pressed', showExtra); renderCombo();
  });
  document.getElementById('toggleComplex').addEventListener('click', function(){
    showComplex = !showComplex; this.setAttribute('aria-pressed', showComplex); renderCombo();
  });
  renderCombo();

  /* --- TAB 2: 받침 단어 --- */
  var batchimEl = document.getElementById('batchimWords');
  var bHtml = '';
  BATCHIM_WORDS.forEach(function(w, idx){
    bHtml += '<div class="word-card">'+
      '<div class="top-row"><span class="emoji">'+w.emoji+'</span><button class="speak-btn" data-say="'+w.kr+'">🔊</button></div>'+
      '<div class="hangul-big">'+w.kr+'</div>'+
      '<input class="meaning" id="bInput'+idx+'" type="text" placeholder="뜻 입력 (다국어 지원)">'+
      '<button class="check-btn" data-idx="'+idx+'">정답 확인</button>'+
      '<div class="check-result" id="bRes'+idx+'"></div>'+
    '</div>';
  });
  batchimEl.innerHTML = bHtml;
  batchimEl.addEventListener('click', function(e){
    if(e.target.classList.contains('speak-btn')){ speak(e.target.dataset.say); }
    if(e.target.classList.contains('check-btn')){
      var idx = e.target.dataset.idx;
      var val = document.getElementById('bInput'+idx).value.trim().toLowerCase();
      var resEl = document.getElementById('bRes'+idx);
      var word = BATCHIM_WORDS[idx];
      var isCorrect = word.meanings.some(function(m){ return val && m.toLowerCase().includes(val); });
      if(isCorrect){
        resEl.textContent = '⭕ 정답입니다!';
        resEl.className = 'check-result correct';
      } else {
        resEl.textContent = '❌ 다시 시도해보세요.';
        resEl.className = 'check-result incorrect';
      }
    }
  });

  /* --- TAB 3: 단어 카드 --- */
  var cardIdx = 0;
  function renderCard(){
    var w = BASIC_WORDS[cardIdx];
    document.getElementById('cardEmoji').textContent = w.emoji;
    document.getElementById('cardHangul').textContent = w.kr;
    document.getElementById('cardRom').textContent = '['+w.rom+']';
    document.getElementById('cardMeaning').value = '';
    document.getElementById('cardCheckResult').textContent = '';
  }
  document.getElementById('prevCard').addEventListener('click', function(){ cardIdx = (cardIdx - 1 + BASIC_WORDS.length) % BASIC_WORDS.length; renderCard(); });
  document.getElementById('nextCard').addEventListener('click', function(){ cardIdx = (cardIdx + 1) % BASIC_WORDS.length; renderCard(); });
  document.getElementById('speakCard').addEventListener('click', function(){ speak(BASIC_WORDS[cardIdx].kr); });
  document.getElementById('flashcard').addEventListener('click', function(){
    var rom = document.getElementById('cardRom');
    rom.style.display = rom.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('checkCardMeaningBtn').addEventListener('click', function(){
    var val = document.getElementById('cardMeaning').value.trim().toLowerCase();
    var resEl = document.getElementById('cardCheckResult');
    var word = BASIC_WORDS[cardIdx];
    var isCorrect = word.meanings.some(function(m){ return val && m.toLowerCase().includes(val); });
    if(isCorrect){
      resEl.textContent = '⭕ 정답입니다!';
      resEl.className = 'check-result correct';
    } else {
      resEl.textContent = '❌ 틀렸습니다.';
      resEl.className = 'check-result incorrect';
    }
  });
  renderCard();

  /* --- TAB 4: 쓰기 연습장 (모든 21개 모음 추가) --- */
  var writeSelect = document.getElementById('writeSelect');
  var opts = '<optgroup label="자음">';
  BASIC_CONS.concat(DOUBLE_CONS).forEach(function(c){ opts += '<option value="'+c+'">'+c+' ('+PHONETIC_MAP[c]+')</option>'; });
  opts += '</optgroup><optgroup label="모음 (전체 21개)">';
  JUNG.forEach(function(v){ opts += '<option value="'+v+'">'+v+' ('+(PHONETIC_MAP[v]||v)+')</option>'; });
  opts += '</optgroup>';
  writeSelect.innerHTML = opts;

  document.getElementById('speakWrite').addEventListener('click', function(){
    speak(writeSelect.value);
  });

  // Canvas 드로잉
  var pad = document.getElementById('pad');
  var ctx = pad.getContext('2d');
  var drawing = false;

  function initPad(){
    pad.width = 300; pad.height = 300;
    ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = '#262220';
  }
  initPad();

  function getPos(e){
    var rect = pad.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  }
  pad.addEventListener('mousedown', function(e){ drawing = true; var p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
  pad.addEventListener('mousemove', function(e){ if(drawing){ var p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); } });
  window.addEventListener('mouseup', function(){ drawing = false; });
  pad.addEventListener('touchstart', function(e){ drawing = true; var p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
  pad.addEventListener('touchmove', function(e){ if(drawing){ var p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); } });
  pad.addEventListener('touchend', function(){ drawing = false; });

  document.getElementById('clearPad').addEventListener('click', function(){
    ctx.clearRect(0, 0, pad.width, pad.height);
  });

})();
</script>
</body>
</html>
